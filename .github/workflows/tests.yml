name: CI

on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - '.github/workflows/tests.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/uv.lock"

      - name: Run lint
        # uvx runs ruff as an isolated tool — no project dep install needed.
        # Ruff discovers pyproject.toml automatically from the working directory.
        # Pinned: unpinned uvx resolves the newest ruff, which with `select = ["ALL"]`
        # enrols newly stabilised rules and reddens CI with no commit involved.
        # Keep in step with the ruff floor in services/pyproject.toml.
        run: cd services && uvx ruff@0.14.14 check application/ domain/ infrastructure/ interfaces/

  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Cache is keyed on uv.lock — invalidated when deps change
          cache-dependency-glob: "services/uv.lock"

      - name: Install dependencies
        # --frozen ensures we install exactly what's in uv.lock
        run: cd services && uv sync --frozen --dev

      - name: Cache Hugging Face models
        # The inference smoke test loads the real embedding and reranker
        # models (~1 GB); cache them so the job stays fast.
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('services/infrastructure/config.py') }}

      - name: Run tests
        env:
          DUAR_SERVICE_KEY: test-dummy-key
          DUAR_URL: http://localhost:9003
        run: cd services && make test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./services/coverage.xml
          fail_ci_if_error: false
