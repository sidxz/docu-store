name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem:
    name: Trivy filesystem (lockfiles + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same bar as the local release gate (scripts/security-scan.sh).
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore
          skip-dirs: "**/node_modules,**/.venv,**/.next,**/dist,services/blobs"

  image:
    name: Trivy image (${{ matrix.component }})
    # Image findings come from the base image, not the commit, and the two builds
    # take 10-15 min. Weekly + manual here; publish-*.yml scans before each push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Read-only caches: layers come from the last published image
          # (publish-services.yml) or the web publish's GHA cache scope.
          - component: services
            image: docu-store
            cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/docu-store:latest
          - component: web
            image: docu-store-web
            cache-from: type=gha,scope=web
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}/
          load: true
          tags: ${{ matrix.image }}:scan
          cache-from: ${{ matrix.cache-from }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:scan
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
          # The base images carry unfixable CRITICALs (will_not_fix) that would
          # otherwise keep this permanently red with no actionable path.
          ignore-unfixed: true
