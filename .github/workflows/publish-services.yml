name: Publish Service Image

on:
  push:
    tags:
      - "services-v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${REF_NAME#services-v}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches pyproject.toml
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${REF_NAME#services-v}"
          FILE_VERSION=$(grep -m1 '^version' services/pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml ($FILE_VERSION)"
            exit 1
          fi

      # Same gate as scripts/security-scan.sh: build, scan, push. The push
      # step rebuilds from the builder's cache, so it only exports.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: services/
          load: true
          tags: docu-store:scan
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/docu-store:latest

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docu-store:scan
          severity: HIGH,CRITICAL
          exit-code: 1
          trivyignores: .trivyignore
          ignore-unfixed: true

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: services/
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/docu-store:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/docu-store:latest
          # The image is pushed anyway, so its layers are the cache (single-stage
          # Dockerfile: inline covers every layer). Exporting a separate GHA cache
          # re-uploaded the multi-GB deps layer and took 5-13 min per publish.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/docu-store:latest
          cache-to: type=inline
