  <line class="s" x1="12.4" y1="18.2" x2="20.45" y2="13.55" stroke-width="1.8"/>
  <polygon points="24,7.1 27.81,9.3 27.81,13.7 24,15.9 20.19,13.7 20.19,9.3" fill="none" stroke="url(#g)" stroke-width="2"/>
