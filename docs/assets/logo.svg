<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- "Cited compound" — DocuStore's mark. Borrowed from
       docustore-site src/components/layout/logo.tsx with CSS vars
       resolved to hex; ink flips to paper in dark mode so the mark
       reads on GitHub's dark theme. -->
  <style>
    .k { fill: #0b0b0d; }
    .s { stroke: #0b0b0d; }
    @media (prefers-color-scheme: dark) {
      .k { fill: #fafafa; }
      .s { stroke: #fafafa; }
    }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="20" y1="16" x2="28" y2="7">
      <stop offset="0" stop-color="#37d7fa"/>
      <stop offset="0.4" stop-color="#4b72fe"/>
      <stop offset="0.68" stop-color="#ff8df2"/>
      <stop offset="1" stop-color="#ff8705"/>
    </linearGradient>
  </defs>
  <path class="s" d="M19 12.9 V6 H5 V26 H19 V15.9" fill="none" stroke-width="2"/>
  <rect class="k" x="8" y="10" width="8" height="2"/>
  <rect class="k" x="8" y="14" width="5" height="2" opacity=".33"/>
